[package]
name = "gt6"
version = "0.1.0"
edition = "2021"
description = "A GTA-inspired top-down open-world game, 100% Rust compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[profile.release]
opt-level = "s"
lto = true

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "CanvasGradient",
    "KeyboardEvent",
    "MouseEvent",
    "WheelEvent",
    "Event",
    "Response",
    "Request",
    "console",
    "AudioContext",
    "AudioContextOptions",
    "OscillatorNode",
    "OscillatorType",
    "GainNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "AudioDestinationNode",
] }
